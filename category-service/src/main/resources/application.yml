spring:
  application:
    name: category-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/category_db
    username: datascraper
    password: datascraper
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,info
