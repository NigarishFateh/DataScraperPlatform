spring:
  application:
    name: scraper-website
  profiles:
    active: dev

server:
  port: 8091

website:
  scraper:
    timeout-ms: 8000
    max-items: 40
    respect-robots-txt: true
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

management:
  endpoints:
    web:
      exposure:
        include: health,info
