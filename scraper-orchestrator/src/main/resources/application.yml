spring:
  application:
    name: scraper-orchestrator
  profiles:
    active: dev

server:
  # Gateway owns 8080. Orchestrator is an internal intelligence service.
  port: 8085

scraper:
  resilience:
    timeout-ms: 15000
    max-retries: 3
    retry-delay-ms: 1000
  execution:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 25
    job-timeout-ms: 60000
  services:
    # Target architecture: scrapers by data source (Phase 9+)
    website:
      base-url: http://localhost:8091
    tech:
      base-url: http://localhost:8092
    news:
      base-url: http://localhost:8093
    github:
      base-url: http://localhost:8094
    contact:
      base-url: http://localhost:8095
    # Legacy company-specific scrapers (mvn -Plegacy) — do not use in new flows
    google:
      base-url: http://localhost:8181
    microsoft:
      base-url: http://localhost:8182
    ibm:
      base-url: http://localhost:8183

app:
  cors:
    # Chrome extension + local Vite side-panel tooling
    allowed-origins: http://localhost:5173,chrome-extension://*

logging:
  level:
    root: INFO
    com.datascraper: INFO
