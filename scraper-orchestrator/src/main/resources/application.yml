spring:
  application:
    name: scraper-orchestrator
  profiles:
    active: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379

server:
  # Gateway owns 8080. Orchestrator is an internal intelligence service.
  port: 8085
  tomcat:
    threads:
      # Headroom for parallel /enrich requests (default Tomcat max is fine; keep explicit).
      max: ${ORCHESTRATOR_TOMCAT_MAX_THREADS:120}
      min-spare: 10

app:
  job-service-uri: ${JOB_SERVICE_URI:http://localhost:8086}
  company-service-uri: ${COMPANY_SERVICE_URI:http://localhost:8083}
  export-service-uri: ${EXPORT_SERVICE_URI:http://localhost:8088}
  redis:
    enabled: false
  queue:
    enabled: true
    poll-interval-ms: 250
    block-timeout-seconds: 5
    # Parallel company enrichments from Redis/in-memory queue. Clamped to 1–16.
    consumer-concurrency: ${ENRICHMENT_CONSUMER_CONCURRENCY:8}
  providers:
    website:
      enabled: true
    contact:
      enabled: true
    github:
      enabled: false
    technology:
      enabled: false
    news:
      enabled: false
    social:
      enabled: false
  cors:
    allowed-origins: chrome-extension://*,http://localhost:*,http://127.0.0.1:*

scraper:
  resilience:
    timeout-ms: 15000
    max-retries: 3
    retry-delay-ms: 1000
  execution:
    # Sized for ~8 concurrent companies × website+contact providers + headroom.
    core-pool-size: 8
    max-pool-size: 24
    queue-capacity: 64
    job-timeout-ms: 60000
  cache:
    enabled: false
    ttl-seconds: 3600
    key-prefix: intel:scraper
  services:
    website:
      base-url: http://localhost:8091
    tech:
      base-url: http://localhost:8092
    news:
      base-url: http://localhost:8093
    github:
      base-url: http://localhost:8094
    contact:
      base-url: http://localhost:8095
    social:
      base-url: http://localhost:8096

logging:
  level:
    root: INFO
    com.datascraper: INFO
