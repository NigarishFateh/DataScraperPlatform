spring:
  application:
    name: scraper-orchestrator
  profiles:
    active: dev
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  data:
    redis:
      host: localhost
      port: 6379

server:
  # Gateway owns 8080. Orchestrator is an internal intelligence service.
  port: 8085

app:
  job-service-uri: ${JOB_SERVICE_URI:http://localhost:8086}
  company-service-uri: ${COMPANY_SERVICE_URI:http://localhost:8083}
  export-service-uri: ${EXPORT_SERVICE_URI:http://localhost:8088}
  redis:
    enabled: false
  queue:
    enabled: true
    poll-interval-ms: 1000
    block-timeout-seconds: 5
  providers:
    website:
      enabled: true
    contact:
      enabled: true
    github:
      enabled: true
    technology:
      enabled: true
    news:
      enabled: true
    social:
      enabled: true
  cors:
    allowed-origins: chrome-extension://*,http://localhost:*,http://127.0.0.1:*

scraper:
  resilience:
    timeout-ms: 15000
    max-retries: 3
    retry-delay-ms: 1000
  execution:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 25
    job-timeout-ms: 60000
  cache:
    enabled: false
    ttl-seconds: 3600
    key-prefix: intel:scraper
  services:
    website:
      base-url: http://localhost:8091
    tech:
      base-url: http://localhost:8092
    news:
      base-url: http://localhost:8093
    github:
      base-url: http://localhost:8094
    contact:
      base-url: http://localhost:8095
    social:
      base-url: http://localhost:8096

logging:
  level:
    root: INFO
    com.datascraper: INFO
