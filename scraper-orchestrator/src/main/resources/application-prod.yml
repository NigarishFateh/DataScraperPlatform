logging:
  level:
    root: WARN
    com.datascraper: INFO

app:
  cors:
    allowed-origins: http://localhost:5173,https://your-app.vercel.app

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

scraper:
  cache:
    enabled: true
    ttl-seconds: 3600
  resilience:
    timeout-ms: 10000
    max-retries: 3
    retry-delay-ms: 2000
  services:
    google:
      base-url: https://scraper-google.example.com
    microsoft:
      base-url: https://scraper-microsoft.example.com
    ibm:
      base-url: https://scraper-ibm.example.com
