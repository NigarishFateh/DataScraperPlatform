logging:
  level:
    root: WARN
    com.datascraper: INFO

app:
  cors:
    allowed-origins: http://localhost:5173,https://your-app.vercel.app

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

scraper:
  cache:
    enabled: true
    ttl-seconds: 3600
  resilience:
    timeout-ms: 10000
    max-retries: 3
    retry-delay-ms: 2000
  services:
    website:
      base-url: ${SCRAPER_WEBSITE_URL:https://scraper-website.example.com}
    contact:
      base-url: ${SCRAPER_CONTACT_URL:https://scraper-contact.example.com}
