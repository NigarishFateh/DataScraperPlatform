# Local profile — real PostgreSQL (same as production config).
# Set GOOGLE_CLIENT_IDS and AUTH_JWT_SECRET via environment for real Google login.
spring:
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USER:datascraper}
    password: ${AUTH_DB_PASSWORD:datascraper}

app:
  auth:
    dev-login-enabled: false
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:}
