spring:
  application:
    name: auth-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: datascraper
    password: datascraper
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Override in real environments via AUTH_JWT_SECRET (min 32 chars).
    secret: ${AUTH_JWT_SECRET:lead-intelligence-dev-secret-change-me-32b}
    issuer: lead-intelligence-auth
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 14
  google:
    # Comma-separated Chrome extension OAuth client IDs (GOOGLE_CLIENT_IDS env var).
    client-ids: ${GOOGLE_CLIENT_IDS:}
    userinfo-url: https://www.googleapis.com/oauth2/v3/userinfo
    tokeninfo-url: https://oauth2.googleapis.com/tokeninfo
  auth:
    dev-login-enabled: ${AUTH_DEV_LOGIN:false}

logging:
  level:
    root: INFO
    com.datascraper.auth: INFO
